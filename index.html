<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V12koz Card - RGB Effect</title>
    <style>
        /* Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f0f0f;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Card Container */
        .card {
            background-color: #232428;
            width: 350px;
            padding: 40px 20px;
            border-radius: 28px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Profile Image */
        .profile-img {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            border: 3px solid #ffffff;
            margin-bottom: 25px;
            object-fit: cover;
            background-color: #2a2d7c; 
        }

        /* Name and Blue Tick Container */
        .name-container {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 15px;
        }

        /* V12koz Text */
        .title {
            font-size: 2rem;
            font-weight: 800;
        }

        /* Blue Tick SVG Styling */
        .blue-tick {
            width: 26px;
            height: 26px;
        }

        /* Millionaire Text beside name */
        .side-text {
            font-size: 1.2rem;
            font-weight: 700;
            margin-top: 5px;
            width: 100%; /* Forces it to the next line smoothly inside the card */
            margin-bottom: 20px;
        }

        /* 🌈 RGB Glowing Animation Effect */
        .rgb-effect {
            background: linear-gradient(270deg, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #9400d3);
            background-size: 600% 600%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: rgb-glow 4s ease infinite;
        }

        @keyframes rgb-glow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Subtitle */
        .subtitle {
            color: #d1d5db;
            font-size: 1rem;
            font-weight: 500;
            line-height: 1.4;
            margin-bottom: 30px;
        }

        /* Music Button */
        .btn-music {
            background-color: #ffffff;
            color: #000000;
            border: none;
            padding: 14px 28px;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: transform 0.2s, background-color 0.2s;
            box-shadow: 0 4px 12px rgba(255, 255, 255, 0.15);
        }

        .btn-music:hover {
            transform: scale(1.03);
            background-color: #f0f0f0;
        }

        .icon {
            background-color: #ff9800;
            color: white;
            border-radius: 6px;
            padding: 2px 6px;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Profile Picture -->
        <img src="https://api.dicebear.com/7.x/bottts/svg?seed=V12" alt="Profile" class="profile-img">

        <!-- Title, Blue Tick and RGB Text -->
        <div class="name-container">
            <h1 class="title rgb-effect">V12koz</h1>
            
            <!-- Original Style Blue Tick SVG -->
            <svg class="blue-tick" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                <path fill="#1DA1F2" d="M22.5 12.5l-1.58 1.58.22 2.22-2.22.46-1.04 2.01-2.12-.9-1.95 1.1-1.95-1.1-2.12.9-1.04-2.01-2.22-.46.22-2.22-1.58-1.58 1.58-1.58-.22-2.22 2.22-.46 1.04-2.01 2.12.9 1.95-1.1 1.95 1.1 2.12-.9 1.04 2.01 2.22.46-.22 2.22 1.58 1.58z"/>
                <path fill="#FFFFFF" d="M10.94 16.32l-3.26-3.26 1.41-1.42 1.85 1.85 4.86-5.83 1.53 1.28z"/>
            </svg>

            <!-- Millionaire Text with RGB -->
            <span class="side-text rgb-effect">I am fucking Millionaire</span>
        </div>

        <!-- Subtitle -->
        <p class="subtitle">Welcome To<br>TheamV12</p>

        <!-- Play/Pause Button -->
        <button class="btn-music" id="musicBtn" onclick="toggleMusic()">
            <span class="icon" id="btnIcon">▶</span>
            <span id="btnText">Play Music</span>
        </button>
    </div>

    <!-- Audio Element (Aapki Song .mp3 file ka naam set kar diya hai) -->
    <!-- Dhyan rakhein ki 'Song .mp3' same folder mein hona chahiye -->
    <audio id="bgMusic" loop>
        <source src="Song .mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>

    <script>
        const audio = document.getElementById('bgMusic');
        const btnText = document.getElementById('btnText');
        const btnIcon = document.getElementById('btnIcon');

        function toggleMusic() {
            if (audio.paused) {
                audio.play();
                btnText.textContent = "Pause Music";
                btnIcon.textContent = "⏸";
                btnIcon.style.backgroundColor = "#ff9800"; 
            } else {
                audio.pause();
                btnText.textContent = "Play Music";
                btnIcon.textContent = "▶";
                btnIcon.style.backgroundColor = "#ff9800";
            }
        }
    </script>

</body>
</html>
