<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V12koz</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 16px;
            text-align: center;
            width: 320px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background-color: #3b3054;
            margin: 0 auto 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
        }
        h1 {
            font-size: 22px;
            color: #00ff66;
            margin: 10px 0;
        }
        p {
            color: #00ff66;
            font-size: 14px;
            margin-bottom: 15px;
        }
        .subtext {
            color: #ffffff;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .music-btn {
            background-color: #ffffff;
            color: #000000;
            border: none;
            padding: 12px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .music-btn:hover {
            background-color: #e0e0e0;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Profile Avatar -->
        <div class="avatar">👤</div>
        
        <!-- Name & Bio -->
        <h1>V12koz</h1>
        <p>I am fucking Millionaire</p>
        <div class="subtext">Welcome To TheamV12</div>

        <!-- Audio Element -->
        <audio id="bgMusic">
            <source id="audioSource" src="old-song.mp3" type="audio/mpeg">
        </audio>

        <!-- Song Switch Buttons -->
        <div class="btn-container">
            <button class="music-btn" onclick="switchSong('old-song.mp3')">1. Old Song</button>
            <button class="music-btn" onclick="switchSong('Luminary.mp3')">2. Luminary</button>
        </div>
    </div>

    <script>
        function switchSong(songUrl) {
            var audio = document.getElementById('bgMusic');
            var source = document.getElementById('audioSource');
            
            source.src = songUrl;
            audio.load();
            audio.play();
        }
    </script>
</body>
</html>
